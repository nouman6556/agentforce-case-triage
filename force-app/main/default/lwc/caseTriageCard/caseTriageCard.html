<template>
    <lightning-card title="Agentforce Triage" icon-name="standard:bot">
        <template lwc:if={triage}>
            <div class="slds-p-horizontal_medium">
                <div class="slds-grid slds-gutters slds-m-bottom_small">
                    <div class="slds-col"><p class="label">Category</p><p class="value">{triage.category}</p></div>
                    <div class="slds-col"><p class="label">Priority</p>
                        <lightning-badge label={triage.priority} class={priorityClass}></lightning-badge></div>
                    <div class="slds-col"><p class="label">Sentiment</p><p class="value">{triage.sentiment}</p></div>
                </div>
                <p class="label">Urgency score</p>
                <lightning-progress-bar value={triage.urgencyScore} size="large"></lightning-progress-bar>
                <div class="nba slds-m-top_small slds-p-around_small">
                    <p class="label">Next best action</p>
                    <p>{triage.nextBestAction}</p>
                </div>
                <p class="slds-text-body_small slds-m-top_x-small">Route to: {triage.targetQueue}</p>
            </div>
            <div slot="footer">
                <lightning-button label="Apply priority &amp; routing" variant="brand"
                    onclick={handleApply} disabled={isApplying}></lightning-button>
            </div>
        </template>
        <template lwc:elseif={error}>
            <p class="slds-p-around_medium slds-text-color_error">{error}</p>
        </template>
    </lightning-card>
</template>
